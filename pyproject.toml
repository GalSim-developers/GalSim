[project]
name = "GalSim"
description = "The modular galaxy image simulation toolkit"
readme = "README.rst"
requires-python = ">=3.9"
license-files = ["LICENSE"]
authors = [{ name = "GalSim Developers" }, { name = "Mike Jarvis", email = "michael@jarvis.net" }]
dependencies = ["LSSTDESC.Coord", "astropy"]
dynamic = ["version"]

[project.urls]
repository = "https://github.com/GalSim-developers/GalSim"

[project.scripts]
galsim = "galsim.__main__:run_main"
galsim_download_cosmos = "galsim.download_cosmos:run_main"

[project.optional-dependencies]
test = ["pytest", "pytest-xdist", "pytest-timeout", "scipy", "pyyaml"]

[build-system]
requires = ["numpy>=1.17", "pybind11>=2.2", "setuptools>=38"]

[tool.cibuildwheel]
# share cache directory between runs by using host mount
before-build = "ccache -s"
test-command = 'python -c "from galsim import *"'

[tool.cibuildwheel.linux]
before-all = "yum install -y fftw-devel ccache || apt install libfftw3-dev ccache || apk add --upgrade fftw-dev ccache && ccache -o cache_dir=/host$(ccache -k cache_dir)"

[tool.cibuildwheel.macos]
before-all = "brew install fftw eigen ccache || true && ccache -o cache_dir=/host$(ccache -k cache_dir)"

[tool.cibuildwheel.macos.environment]
FFTW_DIR = "/opt/homebrew/lib"
MACOSX_DEPLOYMENT_TARGET = "14.0"

[tool.pytest.ini_options]
testpaths = [
  "tests",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]

[tool.setuptools.package-data]
"galsim" = ["share/**", "include/**"]

[tool.setuptools_scm]
version_file = "galsim/_version.py"
