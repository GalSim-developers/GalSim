name: Build wheels and sdist and upload to PyPI

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: publish to PyPI
        type: boolean
        required: false
        default: true
  release:
    types:
      - released

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  wheels:
    strategy:
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-14
        clib:
          - glib
        include:
          - runs-on: ubuntu-latest
            clib: musl
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cache C++ build objects
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      - uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        env:
          CIBW_BUILD: ${{ runner.os == 'Linux' && (matrix.clib == 'musl' && '*-musllinux_*' || '*-manylinux_*') || '*' }}
        with:
          package-dir: ./
          output-dir: wheelhouse/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ runner.os }}-${{ runner.arch }}-${{ matrix.clib }}
          path: ./wheelhouse/
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt install libfftw3-dev
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3"
      - run: pip install build
      - run: python -m build --sdist --outdir ./wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-src
          path: ./wheelhouse/
  publish:
    if: ((github.event_name == 'release') && (github.event.action == 'released')) || inputs.publish_to_pypi
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    # To add required reviewers before deployment,
    # edit the protection rules in GitHub Settings:
    # Settings > Environments > pypi > Add required reviewers
    environment:
      name: pypi
      url: https://pypi.org/p/GalSim
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist*
          path: wheelhouse/
          merge-multiple: true
      # To upload to PyPI without a token, add this workflow file as a Trusted Publisher in the project settings on the PyPI website
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: "./wheelhouse"
